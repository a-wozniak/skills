# Diagnostic Investigation Resources
#
# Single source of truth for all data sources available to diagnostic agents.
# Agents read this file at startup to discover what's available.
# Adding a new resource = adding an entry here. No agent file edits needed.
#
# available_to: which agent roles can use this resource
#   triage    — lightweight initial data gathering
#   generator — hypothesis generation (knowledge sources)
#   tester    — hypothesis testing (live data + knowledge)
#   orchestrator — the orchestrator agent (presents findings to user)
#
# targets: (optional) list of product/feature domains this resource covers.
#   Applies to all resource types: tools, endpoints, and paths.
#   If omitted, the resource covers all domains (general fallback).
#   If set, agents should prefer this resource when the investigation domain matches.
#   Routing: match state.json.scope.domain against targets. Use the most specific
#   resource first; fall back to resources without targets if no match.

tools:
  - id: uip
    description: >
      UiPath CLI — the primary tool for interacting with the UiPath platform.
      Always use --format json for structured, parseable output.
    available_to: [triage, tester]
    usage: |
      Discover available commands by running: uip --help-all
      Drill down with: uip <subcommand> --help
      Some commands support -o, --output <path> to save results directly to a directory.
  - id: documentation_cli
    description: >
      Documentation and knowledge base search.
    available_to: [generator, tester, orchestrator]
    usage: |
      uip docsai ask "<question>" --source [docs, technical_solution_articles]

endpoints:
  - id: documentation
    url: https://docs.uipath.com/search#f-language=English
    query_param: q
    description: >
      Documentation and knowledge base search.
      Also use this to look up user-facing names of settings and fields —
      search semantically (e.g., "job execution timeout" not "MaxExpectedRunningTimeSeconds")
      since API property names are usually not directly represented in the docs.
    available_to: [generator, tester, orchestrator]

paths:
  - id: knowledge-base
    path: references
    description: >
      Product knowledge base — per-product documentation, features, and diagnostic playbooks.
      Contains domain knowledge not found in public docs: internal dependencies, failure modes
      learned from experience, data gathering strategies, and interpretation rules.
    available_to: [triage, generator, tester]
    usage: |
      Structure:
        products/{id}/          — Service-level products (orchestrator, maestro, etc.)
        activity-packages/{id}/ — Client-side activity libraries (ui-automation, excel, etc.)
        Each has: overview.md, features/*.md, playbooks/**/*.md

      Navigation:
        1. Read {type}/{id}/overview.md for product info and depends_on
        2. Read {type}/{id}/features/*.md for domain knowledge
           (e.g., data gathering strategies, interpretation rules, known patterns)
        3. Scan {type}/{id}/playbooks/**/*.md for diagnostic playbooks
           Match scenario frontmatter to symptoms, filter by version (since/until)
        4. For activity-level failures: read activity-packages/index.md
           Match faulted activity namespace from traces to an activity package
        5. Feature files are the primary source for specialized data gathering —
           read them before ad-hoc queries

      See references/guides/guide.md for full documentation.

  - id: references
    path: references
    description: >
      CLI reference and product guides.
      Use for CLI command lookup and general product concepts.
    available_to: [generator, tester]
    usage: |
      Reference documentation:
        uip-commands.md            — Full CLI command reference (all command groups)
      Cross-reference with uip-commands.md for available CLI operations.
